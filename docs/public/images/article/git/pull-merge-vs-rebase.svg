<text x="376" y="54" text-anchor="start" font-family='-apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif' font-size="13" font-weight="600" fill="#d7dae0">git pull --rebase：你的 commit 重做一次，接在遠端後面</text>
<text x="576" y="222" text-anchor="middle" font-family='-apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif' font-size="12" font-weight="400" fill="#7f848e">D'、E' 是新的 commit，hash 變了</text>
<text x="20" y="362" text-anchor="start" font-family='-apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif' font-size="12" font-weight="400" fill="#7f848e">一條直線比較好讀，代價是本機那幾個 commit 被重寫；還沒 push 過的 commit 才能這樣做</text>
</svg>