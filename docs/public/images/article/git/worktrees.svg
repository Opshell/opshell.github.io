<text x="20" y="270" text-anchor="start" font-family='-apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif' font-size="12" font-weight="400" fill="#7f848e">同一條分支不能同時被兩個 worktree 站著，git 會擋。這個限制反而是好事：一條分支一個主人</text>
<text x="20" y="292" text-anchor="start" font-family='-apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif' font-size="12" font-weight="400" fill="#7f848e">node_modules、.env.local、dist 這些沒進版控的東西不會跟過去，每個資料夾要自己裝一次</text>
<text x="20" y="314" text-anchor="start" font-family='-apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif' font-size="12" font-weight="400" fill="#7f848e">2026-10-05 實況：六個 worktree、六條分支、四個對話同時在跑</text>
</svg>