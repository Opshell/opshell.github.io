<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 280" width="700" height="280" role="img" aria-label="reset 的三種模式分別影響 HEAD、暫存區、工作目錄中的哪幾個">
<title>reset 的三種模式分別影響 HEAD、暫存區、工作目錄中的哪幾個</title>
<defs><marker id="parent-bg" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#282c34"/></marker><marker id="parent-text" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d7dae0"/></marker><marker id="parent-muted" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#7f848e"/></marker><marker id="parent-line" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#4b5263"/></marker><marker id="parent-main" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f4b936"/></marker><marker id="parent-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#61afef"/></marker><marker id="parent-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#98c379"/></marker><marker id="parent-purple" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#c678dd"/></marker><marker id="parent-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#e06c75"/></marker><marker id="parent-cyan" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#56b6c2"/></marker><marker id="parent-orange" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d19a66"/></marker></defs>
<rect width="700" height="280" rx="10" fill="#282c34"/>
<text x="20" y="26" text-anchor="start" font-family='-apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif' font-size="14" font-weight="600" fill="#d7dae0">git reset 的三種力道：往回退的時候，哪幾層跟著退</text>
<rect x="40" y="60" width="180" height="70" rx="8" fill="none" stroke="#f4b936" stroke-width="2"/><text x="130" y="89.83333333333333" text-anchor="middle" font-family='-apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif' font-size="13" fill="#f4b936">HEAD（分支指標）</text><text x="130" y="108.83333333333333" text-anchor="middle" font-family='-apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif' font-size="13" fill="#f4b936">歷史退回去</text>
<rect x="260" y="60" width="180" height="70" rx="8" fill="none" stroke="#56b6c2" stroke-width="2"/><text x="350" y="89.83333333333333" text-anchor="middle" font-family='-apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif' font-size="13" fill="#56b6c2">暫存區（index）</text><text x="350" y="108.83333333333333" text-anchor="middle" font-family='-apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif' font-size="13" fill="#56b6c2">git add 過的東西</text>
<rect x="480" y="60" width="180" height="70" rx="8" fill="none" stroke="#98c379" stroke-width="2"/><text x="570" y="89.83333333333333" text-anchor="middle" font-family='-apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif' font-size="13" fill="#98c379">工作目錄</text><text x="570" y="108.83333333333333" text-anchor="middle" font-family='-apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif' font-size="13" fill="#98c379">你眼前的檔案</text>
<rect x="40" y="160" width="180" height="32" rx="8" fill="rgba(244,185,54,0.18)" stroke="#f4b936" stroke-width="2"/><text x="130" y="180.33333333333334" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="13" fill="#f4b936">--soft</text>
<rect x="40" y="200" width="400" height="32" rx="8" fill="rgba(86,182,194,0.18)" stroke="#56b6c2" stroke-width="2"/><text x="240" y="220.33333333333334" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="13" fill="#56b6c2">--mixed（預設）</text>
<rect x="40" y="240" width="620" height="32" rx="8" fill="rgba(224,108,117,0.18)" stroke="#e06c75" stroke-width="2"/><text x="350" y="260.3333333333333" text-anchor="middle" font-family='ui-monospace, SFMono-Regular, Menlo, Consolas, monospace' font-size="13" fill="#e06c75">--hard</text>
<text x="240" y="181" text-anchor="start" font-family='-apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif' font-size="12" font-weight="400" fill="#7f848e">← 只有指標退；改動全留在暫存區，等著重新 commit</text>
<text x="460" y="221" text-anchor="start" font-family='-apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif' font-size="12" font-weight="400" fill="#7f848e">← 指標退、暫存清空；改動還在檔案裡</text>
</svg>